<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Portfolio | Swayam</title>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        crossorigin="anonymous"
        referrerpolicy="no-referrer"
    >

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            background: linear-gradient(135deg, #ffffff, #eef7f7);
            color: #222;
            overflow-x: hidden;
        }

        a {
            text-decoration: none;
        }

        /* ================= NAVBAR ================= */

        .navbar {
            width: 100%;
            background: darkcyan;
            padding: 14px 5%;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
        }

        .navdiv {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .logo a {
            color: lightskyblue;
            font-size: 30px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .logo a:hover {
            color: white;
        }

        .navdiv ul {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            list-style: none;
            flex-wrap: wrap;
        }

        .navdiv li {
            list-style: none;
        }

        .navdiv li a {
            position: relative;
            display: inline-block;
            color: white;
            font-size: 16px;
            font-weight: bold;
            padding: 8px 10px;
            transition: 0.3s ease;
        }

        .navdiv li a:hover {
            color: #eaffff;
        }

        .navdiv li a:not(.contact-nav-btn)::after {
            content: "";
            position: absolute;
            left: 10px;
            bottom: 2px;
            width: 0;
            height: 2px;
            background: white;
            transition: 0.3s ease;
        }

        .navdiv li a:not(.contact-nav-btn):hover::after {
            width: calc(100% - 20px);
        }

        /* CONTACT BUTTON */

        .contact-nav-btn {
            background: black;
            border-radius: 10px;
            padding: 10px 15px !important;
            margin-left: 5px;
        }

        .contact-nav-btn:hover {
            background: #444;
            transform: translateY(-2px);
        }

        /* ================= HERO ================= */

        .hero {
            min-height: calc(100vh - 75px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 60px 7%;
            gap: 40px;
        }

        .info {
            width: 55%;
            animation: leftIn 0.8s ease;
        }

        .intro {
            font-size: 20px;
            margin-bottom: 5px;
        }

        .name {
            font-size: 30px;
            color: darkcyan;
            margin-bottom: 12px;
        }

        .info h1 {
            font-size: clamp(50px, 7vw, 85px);
            line-height: 1;
            margin-bottom: 25px;
            color: rgb(36, 32, 30);
        }

        .info h1 span {
            color: rgb(230, 104, 59);
        }

        .description {
            font-size: 18px;
            line-height: 1.9;
            letter-spacing: 0.5px;
            color: #444;
            margin-bottom: 20px;
        }

        /* ================= HIRE BUTTON ================= */

        .hire-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: orangered;
            color: white;
            padding: 12px 22px;
            border-radius: 10px;
            font-weight: bold;
            margin: 10px 0 25px;
            transition: 0.3s ease;
        }

        .hire-btn:hover {
            background: darkturquoise;
            transform: translateY(-3px);
        }

        /* ================= IMAGE ================= */

        .image {
            width: 40%;
            min-height: 450px;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: rightIn 0.8s ease;
        }

        .image img {
            max-width: 100%;
            max-height: 520px;
            width: auto;
            height: auto;
            object-fit: contain;
            border-radius: 30px;
            filter: drop-shadow(0 20px 25px rgba(0, 0, 0, 0.18));
            transition: 0.4s ease;
        }

        .image img:hover {
            transform: translateY(-8px) scale(1.02);
        }

        /* ================= SOCIAL ICONS ================= */

        .icons {
            display: flex;
            gap: 15px;
        }

        .icons a {
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #222;
            background: rgba(0, 139, 139, 0.08);
            border-radius: 50%;
            transition: 0.3s ease;
        }

        .icons a:hover {
            color: white;
            background: darkcyan;
            transform: translateY(-4px);
        }

        .icons i {
            font-size: 22px;
        }

        /* ================= ANIMATION ================= */

        @keyframes leftIn {
            from {
                opacity: 0;
                transform: translateX(-40px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes rightIn {
            from {
                opacity: 0;
                transform: translateX(40px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* ================= TABLET ================= */

        @media (max-width: 900px) {

            .navbar {
                position: relative;
            }

            .navdiv {
                flex-direction: column;
            }

            .hero {
                min-height: auto;
                flex-direction: column;
                text-align: center;
                padding: 50px 6%;
            }

            .info {
                width: 100%;
                display: flex;
                flex-direction: column;
                align-items: center;
            }

            .description {
                max-width: 650px;
            }

            .icons {
                justify-content: center;
            }

            .image {
                width: 75%;
                min-height: 400px;
            }
        }

        /* ================= MOBILE ================= */

        @media (max-width: 600px) {

            .navbar {
                padding: 12px 5px;
            }

            .logo a {
                font-size: 26px;
            }

            .navdiv ul {
                gap: 1px;
            }

            .navdiv li a {
                font-size: 10px;
                padding: 6px 4px;
            }

            .contact-nav-btn {
                font-size: 10px !important;
                padding: 7px 8px !important;
            }

            .hero {
                padding: 40px 5%;
            }

            .intro {
                font-size: 17px;
            }

            .name {
                font-size: 25px;
            }

            .info h1 {
                font-size: 44px;
            }

            .description {
                font-size: 15px;
                line-height: 1.8;
            }

            .image {
                width: 90%;
                min-height: 320px;
            }
        }

        /* ================= SMALL PHONE ================= */

        @media (max-width: 380px) {

            .navdiv li a {
                font-size: 9px;
                padding: 5px 3px;
            }

            .contact-nav-btn {
                font-size: 9px !important;
            }

            .info h1 {
                font-size: 38px;
            }

            .image {
                min-height: 280px;
            }
        }
    </style>
</head>

<body>

    <!-- ================= NAVBAR ================= -->

    <nav class="navbar">

        <div class="navdiv">

            <div class="logo">
                <a href="main.html">PORTFOLIO</a>
            </div>

            <ul>

                <li>
                    <a href="main.html">Home</a>
                </li>

                <li>
                    <a href="about.html">About</a>
                </li>

                <li>
                    <a href="service.html">Service</a>
                </li>

                <li>
                    <a href="education.html">Education</a>
                </li>

                <li>
                    <a href="skill.html">Skill</a>
                </li>

                <li>
                    <a href="projects.html">Projects</a>
                </li>

                <!-- IMPORTANT: DIRECT LINK -->
                <li>
                    <a
                        href="contact.html"
                        class="contact-nav-btn"
                    >
                        Contact Me
                    </a>
                </li>

            </ul>

        </div>

    </nav>


    <!-- ================= HERO ================= -->

    <main class="hero">

        <div class="info">

            <p class="intro">
                HI, I'm
            </p>

            <h2 class="name">
                Swayam.
            </h2>

            <h1>
                <span>E</span>NGINEE<span>R</span>
            </h1>

            <p class="description">
                I am also a web designer and developer.
                <br>
                I create websites and also video editing.
                <br>
                I am a creative UI/UX designer.
            </p>

            <!-- HIRE ME -->
            <a
                href="hireme.html"
                class="hire-btn"
            >
                Hire Me
                <i class="fa-solid fa-arrow-right"></i>
            </a>

            <!-- SOCIAL ICONS -->
            <div class="icons">

                <a href="#" aria-label="Facebook">
                    <i class="fa-brands fa-square-facebook"></i>
                </a>

                <a href="#" aria-label="Instagram">
                    <i class="fa-brands fa-instagram"></i>
                </a>

                <a href="#" aria-label="Twitter">
                    <i class="fa-brands fa-twitter"></i>
                </a>

            </div>

        </div>


        <!-- PROFILE IMAGE -->

        <div class="image">

            <img
                src="images/pic.jpg"
                alt="Swayam"
            >

        </div>

    </main>

</body>

</html>
