<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Portfolio | Swayam</title>

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVv/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous"
        referrerpolicy="no-referrer"
    />

    <style>

        /* =========================
           BASIC RESET
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            text-decoration: none;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            background: #f5f7fa;
            color: #222;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            overflow-x: hidden;
        }


        /* =========================
           NAVBAR
        ========================= */

        .navbar {
            width: 100%;
            background: darkcyan;
            padding: 15px 5%;
            position: relative;
            z-index: 1000;
        }

        .navdiv {
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 1400px;
            margin: auto;
        }

        .LOGO a {
            font-size: 35px;
            font-weight: 600;
            color: lightskyblue;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 25px;
            list-style: none;
        }

        .nav-links li {
            list-style: none;
        }

        .nav-links li a {
            color: white;
            font-size: 18px;
            font-weight: bold;
            transition: 0.3s ease;
        }

        .nav-links li a:hover {
            color: lightskyblue;
        }

        .contact-btn {
            background-color: black;
            border: none;
            border-radius: 10px;
            padding: 10px 15px;
            cursor: pointer;
            transition: 0.4s ease;
        }

        .contact-btn a {
            color: white;
            font-weight: bold;
            font-size: 15px;
        }

        .contact-btn:hover {
            background-color: gray;
            transform: translateY(-2px);
        }


        /* =========================
           MOBILE MENU BUTTON
        ========================= */

        .menu-btn {
            display: none;
            color: white;
            font-size: 28px;
            cursor: pointer;
        }


        /* =========================
           HERO SECTION
        ========================= */

        .hero {
            min-height: calc(100vh - 75px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 1400px;
            margin: auto;
            padding: 60px 7%;
            gap: 50px;
        }


        /* =========================
           LEFT CONTENT
        ========================= */

        .info {
            flex: 1;
            max-width: 650px;
            z-index: 2;
        }

        .info h3 {
            font-size: 22px;
            line-height: 1.6;
            letter-spacing: 1px;
            color: #333;
        }

        .info h2 {
            display: inline;
            font-size: 30px;
        }

        .info h1 {
            margin: 10px 0 20px;
            font-size: clamp(50px, 7vw, 85px);
            color: rgb(36, 32, 30);
            letter-spacing: 2px;
        }

        .info span {
            color: rgb(230, 104, 59);
        }

        .description {
            margin-top: 10px;
            font-size: 19px;
            line-height: 1.8;
            letter-spacing: 0.5px;
            color: #444;
        }


        /* =========================
           HIRE ME BUTTON
        ========================= */

        .hire-btn {
            background-color: orangered;
            border: none;
            border-radius: 10px;
            margin-top: 30px;
            padding: 13px 25px;
            cursor: pointer;
            transition: 0.4s ease;
        }

        .hire-btn a {
            color: white;
            font-size: 17px;
            font-weight: bold;
        }

        .hire-btn:hover {
            background-color: darkturquoise;
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }


        /* =========================
           IMAGE SECTION
        ========================= */

        .image {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            max-width: 500px;
            position: relative;
        }

        .image::before {
            content: "";
            position: absolute;
            width: 360px;
            height: 360px;
            background: rgba(230, 104, 59, 0.15);
            border-radius: 50%;
            animation: floatingCircle 4s ease-in-out infinite;
        }

        .image img {
            position: relative;
            width: min(380px, 80vw);
            height: min(480px, 70vh);
            object-fit: cover;
            object-position: center;
            border-radius: 30px;
            border: 6px solid orangered;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            z-index: 1;
            animation: imageFloat 4s ease-in-out infinite;
        }


        /* =========================
           SOCIAL ICONS
        ========================= */

        .icons {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-top: 35px;
        }

        .icons a {
            color: #000;
            transition: 0.3s ease;
        }

        .icons i {
            font-size: 2rem;
            transition: 0.3s ease;
        }

        .icons a:hover {
            color: darkslategrey;
            transform: translateY(-4px);
        }


        /* =========================
           ANIMATIONS
        ========================= */

        @keyframes imageFloat {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-15px);
            }
        }

        @keyframes floatingCircle {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-15px);
            }
        }


        /* =========================
           TABLET
        ========================= */

        @media (max-width: 1000px) {

            .navbar {
                padding: 15px 4%;
            }

            .nav-links {
                gap: 15px;
            }

            .nav-links li a {
                font-size: 16px;
            }

            .hero {
                padding: 50px 5%;
                gap: 30px;
            }

            .info h1 {
                font-size: 60px;
            }

            .info h3 {
                font-size: 20px;
            }

            .description {
                font-size: 17px;
            }

            .image img {
                width: 320px;
                height: 420px;
            }

            .image::before {
                width: 300px;
                height: 300px;
            }
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 768px) {

            .navbar {
                padding: 15px 6%;
            }

            .navdiv {
                flex-wrap: wrap;
            }

            .LOGO a {
                font-size: 28px;
            }

            .menu-btn {
                display: block;
            }

            .nav-links {
                display: none;
                width: 100%;
                flex-direction: column;
                align-items: center;
                gap: 18px;
                padding-top: 25px;
            }

            .nav-links.active {
                display: flex;
            }

            .nav-links li a {
                font-size: 17px;
            }

            .hero {
                min-height: auto;
                flex-direction: column;
                text-align: center;
                padding: 60px 6%;
            }

            .info {
                max-width: 100%;
            }

            .info h3 {
                font-size: 19px;
            }

            .info h2 {
                font-size: 27px;
            }

            .info h1 {
                font-size: clamp(45px, 14vw, 65px);
            }

            .description {
                font-size: 17px;
                line-height: 1.7;
            }

            .hire-btn {
                margin-top: 25px;
            }

            .icons {
                justify-content: center;
                margin-top: 30px;
            }

            .image {
                width: 100%;
                max-width: 400px;
                margin-top: 20px;
            }

            .image img {
                width: min(300px, 80vw);
                height: 380px;
            }

            .image::before {
                width: 280px;
                height: 280px;
            }
        }


        /* =========================
           SMALL PHONES
        ========================= */

        @media (max-width: 480px) {

            .navbar {
                padding: 14px 5%;
            }

            .LOGO a {
                font-size: 25px;
            }

            .hero {
                padding: 45px 5% 50px;
            }

            .info h3 {
                font-size: 17px;
            }

            .info h2 {
                font-size: 24px;
            }

            .info h1 {
                font-size: 43px;
                margin: 8px 0 15px;
            }

            .description {
                font-size: 16px;
            }

            .hire-btn {
                padding: 12px 22px;
            }

            .icons i {
                font-size: 1.7rem;
            }

            .image img {
                width: 250px;
                height: 330px;
                border-width: 5px;
                border-radius: 25px;
            }

            .image::before {
                width: 230px;
                height: 230px;
            }
        }

    </style>
</head>


<body>

    <!-- =========================
         NAVIGATION BAR
    ========================== -->

    <nav class="navbar">

        <div class="navdiv">

            <div class="LOGO">
                <a href="#">PORTFOLIO</a>
            </div>

            <!-- Mobile menu icon -->
            <div class="menu-btn" id="menuBtn">
                <i class="fa-solid fa-bars"></i>
            </div>

            <ul class="nav-links" id="navLinks">

                <li>
                    <a href="main.html">Home</a>
                </li>

                <li>
                    <a href="about.html">About</a>
                </li>

                <li>
                    <a href="service.html">Service</a>
                </li>

                <li>
                    <a href="education.html">Education</a>
                </li>

                <li>
                    <a href="skill.html">Skill</a>
                </li>

                <li>
                    <a href="projects.html">Projects</a>
                </li>

                <li>
                    <button class="contact-btn">
                        <a href="contactme.html">Contact Me</a>
                    </button>
                </li>

            </ul>

        </div>

    </nav>


    <!-- =========================
         HERO / MAIN SECTION
    ========================== -->

    <main class="hero">

        <div class="info">

            <h3>
                HI, I'm
                <span>
                    <h2>Swayam.</h2>
                </span>
            </h3>

            <h1>
                <span>E</span>NGINEE<span>R</span>
            </h1>

            <p class="description">
                I am also a web designer and developer.
                <br>
                I create websites and also video editing.
                <br>
                I am a creative UI/UX designer.
            </p>

            <button class="hire-btn">
                <a href="contactme.html">Hire Me</a>
            </button>


            <!-- Social Media -->

            <div class="icons">

                <a href="#" aria-label="Facebook">
                    <i class="fa-brands fa-square-facebook"></i>
                </a>

                <a href="#" aria-label="Instagram">
                    <i class="fa-brands fa-instagram"></i>
                </a>

                <a href="#" aria-label="Twitter">
                    <i class="fa-brands fa-twitter"></i>
                </a>

            </div>

        </div>


        <!-- =========================
             PROFILE IMAGE
        ========================== -->

        <div class="image">

            <img
                src="images/pic.jpg"
                alt="Swayam - Portfolio Profile"
                class="me"
            >

        </div>

    </main>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script>

        const menuBtn = document.getElementById("menuBtn");
        const navLinks = document.getElementById("navLinks");

        menuBtn.addEventListener("click", function () {

            navLinks.classList.toggle("active");

        });


        // Close mobile menu after clicking a link

        const links = document.querySelectorAll(".nav-links a");

        links.forEach(function (link) {

            link.addEventListener("click", function () {

                navLinks.classList.remove("active");

            });

        });

    </script>

</body>

</html>
